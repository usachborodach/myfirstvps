server {
    listen 5.139.108.115:8004;
    server_name _;

    # Логи
    access_log /var/log/nginx/achievement_tracker.access.log;
    error_log  /var/log/nginx/achievement_tracker.error.log;

    # Размер тела запроса (для текстов в textarea)
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8004;

        # Передаём реальный IP клиента приложению
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Отключаем буферизацию ответов для потоковой передачи (не критично)
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}