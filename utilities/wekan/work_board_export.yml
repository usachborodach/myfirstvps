- "- Не забывать чистить солюшн\n- Найти как заглушить отправку команд на устройство\n\nЗакрыть всё таки [ту 115 задачу](https://gitlab.niias/CvLab/block-m/-/work_items/115) КППА.\n\n- минимум и максимум влажности уточнить\n- оставшееся время на винде и убунте разное\n- проблема с нот сет инференс\n\nSystem.NullReferenceException:\nОшибка в Verification26233Form возникает при вызове ReadConfiguration(), который вызывает _generatorSignal.SendCommand() с различными командами CAN. Если устройство не отвечает или отвечает не вовремя, метод SendCommand падает с этой ошибкой.\n\n\"для локального запуска авто поверки достаточно будет закоментить сам блок if где вызов метода CheckVersionsAsync или оператор return в этом блоке проверки\"\n\nДоработки пайплайна кппа:\n- права файлов после заливки кппа\n- добавить в пайплайн кппа ретраи и сделать шаблон\n- дописать в пайплайн кппа заливку по опенвпн и вайргард"
