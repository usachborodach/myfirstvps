# ============================================================
#  WeKan — Nginx reverse proxy с HTTPS
# ============================================================

# Зона лимитов (можно переиспользовать существующую achievement_zone,
# но для WeKan лучше своя — запросов больше)
limit_req_zone $binary_remote_addr zone=wekan_zone:10m rate=60r/s;

# Карта для WebSocket Upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ============================================================
#  HTTP → HTTPS
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name wekan.usachborodach.ru;

    # Для валидации сертификата
    location ~ ^/.well-known/(acme-challenge|pki-validation)/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
#  HTTPS
# ============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wekan.usachborodach.ru;

    # Сертификаты
    ssl_certificate     /etc/nginx/ssl/wekan.usachborodach.ru.crt;
    ssl_certificate_key /etc/nginx/ssl/wekan.usachborodach.ru.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Логи
    access_log /var/log/nginx/wekan.access.log;
    error_log  /var/log/nginx/wekan.error.log warn;

    # WeKan грузит вложения и аватары — увеличим лимит
    client_max_body_size 100m;

    # Таймауты
    client_body_timeout   60s;
    client_header_timeout 60s;

    # ---------- ПРОКСИРОВАНИЕ НА WEKAN ----------
    location / {
        limit_req zone=wekan_zone burst=120 nodelay;

        proxy_pass http://127.0.0.1:2000;

        # Заголовки для корректной работы приложения
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # ---------- WEBSOCKET (критично для WeKan) ----------
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Долгие таймауты — WebSocket держит соединение постоянно
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        # Отключаем буферизацию для WebSocket-стримов
        proxy_buffering off;
        proxy_cache off;
    }
}