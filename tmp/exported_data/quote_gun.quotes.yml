- _id: 6a62c85b7c64a644c481600d
  category: krugly
  text: ебутся воши в голове
- _id: 6a62c85b7c64a644c481600e
  category: latin
  text: Homo sapiens. Человек разумный.
- _id: 6a62c85b7c64a644c481600f
  category: krugly
  text: без шутки - жить жутко
- _id: 6a62c85b7c64a644c4816010
  category: krugly
  text: любишь медок - люби и холодок
- _id: 6a62c85b7c64a644c4816011
  category: krugly
  text: в умелых руках - и xуй балалайка
- _id: 6a62c85b7c64a644c4816012
  category: shtomnepokushac
  text: Суп из семи залуп. Пять покрошено - одна так брошена
- _id: 6a62c85b7c64a644c4816013
  category: latin
  text: Pia desideria Благие намерения.
- _id: 6a62c85b7c64a644c4816014
  category: latin
  text: Bene placito. По доброй воле.
- _id: 6a62c85b7c64a644c4816015
  category: svetlana_anatolyevna
  text: У меня всё на мази!
- _id: 6a62c85b7c64a644c4816016
  category: shtomnepokushac
  text: Блинов нажарь, да с вареньем малиновым
- _id: 6a62c85b7c64a644c4816017
  category: latin
  text: Si vis pacem, para bellum. Хочешь мира, готовься к войне.
- _id: 6a62c85b7c64a644c4816018
  category: wolf
  text: настоящий отец мать брат двоюродный дед
- _id: 6a62c85b7c64a644c4816019
  category: shtomnepokushac
  text: Сладкая сочная пышная горячая советская писечка
- _id: 6a62c85b7c64a644c481601a
  category: latin
  text: Labores gigunt hanores. Труды порождают почести.
- _id: 6a62c85b7c64a644c481601b
  category: latin
  text: Amat victoria curam. Победа любит заботу.
- _id: 6a62c85b7c64a644c481601c
  category: latin
  text: Corda nostra laudus est. Наши сердца больны от любви.
- _id: 6a62c85b7c64a644c481601d
  category: krugly
  text: ебут друг дружку, а деньги в кружку
- _id: 6a62c85b7c64a644c481601e
  category: latin
  text: Epistula non erubescit. Бумага не краснеет.
- _id: 6a62c85b7c64a644c481601f
  category: latin
  text: Timeo danaos et dona ferentes. Бойтесь данайцев, дары приносящих.
- _id: 6a62c85b7c64a644c4816020
  category: shtomnepokushac
  text: Гибридов пожарь. Если бока ножом посечь - с мелкими костями проблем не будет.
    Кукурузной мукой посыпать лучше.
- _id: 6a62c85b7c64a644c4816021
  category: krugly
  text: невеста, без причинного места
- _id: 6a62c85b7c64a644c4816022
  category: shtomnepokushac
  text: купатцы
- _id: 6a62c85b7c64a644c4816023
  category: krugly
  text: муж в тверь - жена в дверь
- _id: 6a62c85b7c64a644c4816024
  category: latin
  text: Sic transit gloria mundi. Так проходит земная слава.
- _id: 6a62c85b7c64a644c4816025
  category: latin
  text: Do ut des. Даю, чтобы и ты дал.
- _id: 6a62c85b7c64a644c4816026
  category: latin
  text: Est modus in rebus. Есть мера в вещах.
- _id: 6a62c85b7c64a644c4816027
  category: latin
  text: In medias res. В середину вещей, в самую суть.
- _id: 6a62c85b7c64a644c4816028
  category: latin
  text: Lectori benevolo salutem. (L.B.S.) Привет благосклонному читателю.
- _id: 6a62c85b7c64a644c4816029
  category: latin
  text: Otium post negotium. Отдых после дела.
- _id: 6a62c85b7c64a644c481602a
  category: shtomnepokushac
  text: Чебуреки. Чтоб кусаешь, а оно брыжжет горячим посюду
- _id: 6a62c85b7c64a644c481602b
  category: latin
  text: Qualis rex, talis grex. Каков поп, таков и приход.
- _id: 6a62c85b7c64a644c481602c
  category: svetlana_anatolyevna
  text: Едрит-мадрит!
- _id: 6a62c85b7c64a644c481602d
  category: latin
  text: Credo, quia verum (absurdum). Верю, ибо это истина (это абсурдно).
- _id: 6a62c85b7c64a644c481602e
  category: krugly
  text: комиссия отца денисия
- _id: 6a62c85b7c64a644c481602f
  category: krugly
  text: обидели мышку - написяли в норку
- _id: 6a62c85b7c64a644c4816030
  category: krugly
  text: свой своему - поневоле брат
- _id: 6a62c85b7c64a644c4816031
  category: svetlana_anatolyevna
  text: Медведь на ухо наступил!
- _id: 6a62c85b7c64a644c4816032
  category: latin
  text: Aut - aut. Или-или.
- _id: 6a62c85b7c64a644c4816033
  category: krugly
  text: не было бы разницы - рос бы хуй на заднице
- _id: 6a62c85b7c64a644c4816034
  category: latin
  text: Nota bene. Запомни хорошо.
- _id: 6a62c85b7c64a644c4816035
  category: krugly
  text: свежо питание - а серется с трудом
- _id: 6a62c85b7c64a644c4816036
  category: krugly
  text: просто так даже муха не пернет
- _id: 6a62c85b7c64a644c4816037
  category: krugly
  text: не пеняй на шиву - коли морда вшива
- _id: 6a62c85b7c64a644c4816038
  category: krugly
  text: мыться купаться - в жопу ебаться
- _id: 6a62c85b7c64a644c4816039
  category: latin
  text: E fructu arbor cognoscitur. Дерево узнается по плоду.
- _id: 6a62c85b7c64a644c481603a
  category: krugly
  text: обещал - не значит женился
- _id: 6a62c85b7c64a644c481603b
  category: latin
  text: In vene veritas. Истина в вине.
- _id: 6a62c85b7c64a644c481603c
  category: shtomnepokushac
  text: Синенькие. Дело долгое, но того стоит.
- _id: 6a62c85b7c64a644c481603d
  category: krugly
  text: хуяк, вы слушали маяк
- _id: 6a62c85b7c64a644c481603e
  category: shtomnepokushac
  text: Какой-то непонятный салат, куда крошат морковку, капусту и яблоки с ананасами
- _id: 6a62c85b7c64a644c481603f
  category: svetlana_anatolyevna
  text: Макашечка!
- _id: 6a62c85b7c64a644c4816040
  category: latin
  text: Ave Caesar, morituri te salutant Идущие на смерть, Цезарь, приветствуют тебя!
- _id: 6a62c85b7c64a644c4816041
  category: latin
  text: Sancta sanctorum. Святая святых.
- _id: 6a62c85b7c64a644c4816042
  category: shtomnepokushac
  text: Свари курицу и сотвори лапшу. И будет это хорошо.
- _id: 6a62c85b7c64a644c4816043
  category: krugly
  text: моча ивана кузьмича
- _id: 6a62c85b7c64a644c4816044
  category: shtomnepokushac
  text: Активированный уголь
- _id: 6a62c85b7c64a644c4816045
  category: krugly
  text: лунная призма, дай коммунизма
- _id: 6a62c85b7c64a644c4816046
  category: latin
  text: Alter ego. Второе "я".
- _id: 6a62c85b7c64a644c4816047
  category: krugly
  text: лицом я сер - а калом бур
- _id: 6a62c85b7c64a644c4816048
  category: latin
  text: Una hirundo ver non facit. Одна ласточка весны не делает.
- _id: 6a62c85b7c64a644c4816049
  category: latin
  text: Amicus cognoscitur in amore, more, ore, re. Друг познается в любви, нраве,
    речах, делах.
- _id: 6a62c85b7c64a644c481604a
  category: latin
  text: Homo est animal sociale. Человек есть общественное животное.
- _id: 6a62c85b7c64a644c481604b
  category: krugly
  text: что случилось? - рубашка в жопу засучилась
- _id: 6a62c85b7c64a644c481604c
  category: svetlana_anatolyevna
  text: Выплеснулись!
- _id: 6a62c85b7c64a644c481604d
  category: krugly
  text: пизда дрозда
- _id: 6a62c85b7c64a644c481604e
  category: latin
  text: Ibi victoria ubi concordia. Там победа, где согласие.
- _id: 6a62c85b7c64a644c481604f
  category: shtomnepokushac
  text: дядькины караси зажаренные до дыма
- _id: 6a62c85b7c64a644c4816050
  category: krugly
  text: ни говна ни ложки - ни коня ни шашки
- _id: 6a62c85b7c64a644c4816051
  category: latin
  text: Vale et me ama. Будь и здоров и люби меня.
- _id: 6a62c85b7c64a644c4816052
  category: latin
  text: Salus populi summa lex. Благо народа есть высший закон.
- _id: 6a62c85b7c64a644c4816053
  category: latin
  text: Lupus in fabula. Легок на помине.
- _id: 6a62c85b7c64a644c4816054
  category: latin
  text: Bis dat qui cito dat. Дважды дает тот, кто дает быстро.
- _id: 6a62c85b7c64a644c4816055
  category: krugly
  text: у латыша - хуй да душа
- _id: 6a62c85b7c64a644c4816056
  category: krugly
  text: ни оконцев ни дверцов - полна жопа огурцов
- _id: 6a62c85b7c64a644c4816057
  category: krugly
  text: сколько волка не корми - у ишака все равно хер толще
- _id: 6a62c85b7c64a644c4816058
  category: krugly
  text: пиздеть - не мешки ворочать
- _id: 6a62c85b7c64a644c4816059
  category: latin
  text: I, pede fausto! Иди счастливой поступью!
- _id: 6a62c85b7c64a644c481605a
  category: latin
  text: Si vis amari, ama. Если хочешь быть любимым, люби.
- _id: 6a62c85b7c64a644c481605b
  category: latin
  text: Abussus non tollit usum. Злоупотребление не отменяет употребления.
- _id: 6a62c85b7c64a644c481605c
  category: shtomnepokushac
  text: Съешь же ещё этих мягких французских булок, да выпей  чаю
- _id: 6a62c85b7c64a644c481605d
  category: krugly
  text: жег глаголом, да назвали балаболом
- _id: 6a62c85b7c64a644c481605e
  category: latin
  text: Sic itur ad astra. Так идут к звездам.
- _id: 6a62c85b7c64a644c481605f
  category: krugly
  text: ебануться - туфли гнутся
- _id: 6a62c85b7c64a644c4816060
  category: latin
  text: Clavus clavo pellitur. Клин клином вышибают.
- _id: 6a62c85b7c64a644c4816061
  category: svetlana_anatolyevna
  text: Что то ты блымаешь!
- _id: 6a62c85b7c64a644c4816062
  category: latin
  text: Hominem quaero! (Dioqines) Ищу человека! (Диоген)
- _id: 6a62c85b7c64a644c4816063
  category: svetlana_anatolyevna
  text: Чем чёрт не шутит!
- _id: 6a62c85b7c64a644c4816064
  category: latin
  text: Festina lente! Поспешай медленней!
- _id: 6a62c85b7c64a644c4816065
  category: latin
  text: O fallacem hominum spem! О обманчивая надежда человеческая!
- _id: 6a62c85b7c64a644c4816066
  category: shtomnepokushac
  text: Жареные кабачки, а на них майонез с чесноком.
- _id: 6a62c85b7c64a644c4816067
  category: latin
  text: Elephantum ex musca facis. Делать из мухи слона.
- _id: 6a62c85b7c64a644c4816068
  category: krugly
  text: ебала жаба гадюку. гадюка плакала, а жаба - квакала
- _id: 6a62c85b7c64a644c4816069
  category: krugly
  text: лучше нет влагалища - чем очко товарища
- _id: 6a62c85b7c64a644c481606a
  category: svetlana_anatolyevna
  text: Так! Сказал бедняк!
- _id: 6a62c85b7c64a644c481606b
  category: latin
  text: Lupus non mordet lupum. Волк волка не кусает.
- _id: 6a62c85b7c64a644c481606c
  category: latin
  text: Nulla dies sine linea. Ни дня без строчки.
- _id: 6a62c85b7c64a644c481606d
  category: svetlana_anatolyevna
  text: Весь день муздыкалась!
- _id: 6a62c85b7c64a644c481606e
  category: latin
  text: Urbi et orbi. Городу и миру.
- _id: 6a62c85b7c64a644c481606f
  category: svetlana_anatolyevna
  text: Епона грода!
- _id: 6a62c85b7c64a644c4816070
  category: shtomnepokushac
  text: Еешня с помидоркой
- _id: 6a62c85b7c64a644c4816071
  category: latin
  text: Tempora mutantur et nos mutamur in illis. Времена меняются, и мы меняемся
    вместе с ними.
- _id: 6a62c85b7c64a644c4816072
  category: shtomnepokushac
  text: Тухлая омичка
- _id: 6a62c85b7c64a644c4816073
  category: svetlana_anatolyevna
  text: Панталеты!
- _id: 6a62c85b7c64a644c4816074
  category: krugly
  text: метили в цари, да попали в псари
- _id: 6a62c85b7c64a644c4816075
  category: krugly
  text: хуй не нос - назад не шмыгнешь
- _id: 6a62c85b7c64a644c4816076
  category: shtomnepokushac
  text: Утка по-пекински
- _id: 6a62c85b7c64a644c4816077
  category: shtomnepokushac
  text: Черевички
- _id: 6a62c85b7c64a644c4816078
  category: svetlana_anatolyevna
  text: Дети мои!
- _id: 6a62c85b7c64a644c4816079
  category: latin
  text: Nosce te ipsum! Познай самого себя!
- _id: 6a62c85b7c64a644c481607a
  category: latin
  text: Qui tacet, consentire videtur. Молчание - знак согласия.
- _id: 6a62c85b7c64a644c481607b
  category: latin
  text: Sponte sua sina lege По собственному побуждению.
- _id: 6a62c85b7c64a644c481607c
  category: krugly
  text: чем просить и унижаться - лучше спиздить и съебаться
- _id: 6a62c85b7c64a644c481607d
  category: krugly
  text: я у тёти ночевал - у тёти были гости. я у тёти попросил, она сказала - после
- _id: 6a62c85b7c64a644c481607e
  category: latin
  text: Dum spiro, spero. Пока дышу - надеюсь.
- _id: 6a62c85b7c64a644c481607f
  category: latin
  text: Dixi et animam salvavi. Я сказал это и этим спас свою душу.
- _id: 6a62c85b7c64a644c4816080
  category: jason_statham
  text: Если тебя незаслуженно обидели, вернись и заслужи.
- _id: 6a62c85b7c64a644c4816081
  category: jason_statham
  text: Суп из одной рыбы называется уха, а суп из 5 рыб называется ухахахахаха.
- _id: 6a62c85b7c64a644c4816082
  category: jason_statham
  text: Немой херни не скажет.
- _id: 6a62c85b7c64a644c4816083
  category: jason_statham
  text: Купил мужик штаны для танцев, а они ему как раз-два-три, раз-два-три.
- _id: 6a62c85b7c64a644c4816084
  category: jason_statham
  text: Работа – не волк. Работа – это ворк, а волк – это ходить.
- _id: 6a62c85b7c64a644c4816085
  category: jason_statham
  text: Жи-ши пиши от души.
- _id: 6a62c85b7c64a644c4816086
  category: jason_statham
  text: Живи, кайфуй, играй, гуляй. Упал – вставай, наглей, ругай. Чужих роняй, своих
    спасай. Пельмени, суп, картошка, чай.
- _id: 6a62c85b7c64a644c4816087
  category: jason_statham
  text: Почесал яйца, понюхал руку.
- _id: 6a62c85b7c64a644c4816088
  category: jason_statham
  text: Лучше выпить литр пива, чем не выпить литр пива.
- _id: 6a62c85b7c64a644c4816089
  category: jason_statham
  text: Хозяйство вести, не хером трясти.
- _id: 6a62c85b7c64a644c481608a
  category: jason_statham
  text: Сначала комплименты, потом платишь алименты.
- _id: 6a62c85b7c64a644c481608b
  category: jason_statham
  text: Делу время, а потехе час, пиво, водочка и квас.
- _id: 6a62c85b7c64a644c481608c
  category: jason_statham
  text: Лучше 5 см спереди, чем 2 °C сзади.
- _id: 6a62c85b7c64a644c481608d
  category: jason_statham
  text: На первый урок можно и опоздать, ведь учиться никогда не поздно.
- _id: 6a62c85b7c64a644c481608e
  category: jason_statham
  text: Если тебе где-то не рады в рваных носках, то и в целых туда идти не стоит.
- _id: 6a62c85b7c64a644c481608f
  category: jason_statham
  text: Не хочешь срать, не мучай жопу.
- _id: 6a62c85b7c64a644c4816090
  category: jason_statham
  text: Боюсь только Аллаха, и пьяного казаха.
- _id: 6a62c85b7c64a644c4816091
  category: jason_statham
  text: Пока не доказано, не волнует, что сказано.
- _id: 6a62c85b7c64a644c4816092
  category: jason_statham
  text: Хочу эчпочмак.
- _id: 6a62c85b7c64a644c4816093
  category: jason_statham
  text: Запомните, а то забудете.
- _id: 6a62c85b7c64a644c4816094
  category: jason_statham
  text: Очко – понятие растяжимое.
- _id: 6a62c85b7c64a644c4816095
  category: jason_statham
  text: Сколько писи не тряси, одна капелька в трусы.
- _id: 6a62c85b7c64a644c4816096
  category: jason_statham
  text: Если жизнь – это вызов, я перезвоню.
- _id: 6a62c85b7c64a644c4816097
  category: jason_statham
  text: Не болейте раком. Болейте стоя.
- _id: 6a62c85b7c64a644c4816098
  category: jason_statham
  text: Лучше посрать и опоздать, чем прийти и обосраться.
- _id: 6a62c85b7c64a644c4816099
  category: jason_statham
  text: Если грустно, выпей чаю, станет легче, отвечаю.
- _id: 6a62c85b7c64a644c481609a
  category: jason_statham
  text: Вы имеете право, но не имеете лево.
- _id: 6a62c85b7c64a644c481609b
  category: jason_statham
  text: Секса не будет, только после свадьбы. Скажи своей маме – венчаться будем в
    храме.
- _id: 6a62c85b7c64a644c481609c
  category: jason_statham
  text: Я срать.
- _id: 6a62c85b7c64a644c481609d
  category: jason_statham
  text: Спрятать чувства легко, а вот спрятать стояк сложнее.
- _id: 6a62c85b7c64a644c481609e
  category: jason_statham
  text: Глупый человек жалуется на дырку в кармане, а мудрый использует ее, чтобы
    почесать яйца.
- _id: 6a62c85b7c64a644c481609f
  category: jason_statham
  text: Если вас поливают говном, значит вы заставили кого-то обосраться.
- _id: 6a62c85b7c64a644c48160a0
  category: jason_statham
  text: Остановку знаешь? Я остановил.
- _id: 6a62c85b7c64a644c48160a1
  category: jason_statham
  text: Если я вдруг стану тебе нужен, то я там же, где и был, когда был не нужен.
- _id: 6a62c85b7c64a644c48160a2
  category: jason_statham
  text: Если за двумя зайцами погонишься, то не выловить тебе рыбку из пруда.
- _id: 6a62c85b7c64a644c48160a3
  category: jason_statham
  text: Если пацан сказал, то сделает, если не сделал, значит, пошутил.
- _id: 6a62c85b7c64a644c48160a4
  category: jason_statham
  text: Бесплатный сыр на то и бесплатный, что сыр.
- _id: 6a62c85b7c64a644c48160a5
  category: jason_statham
  text: А ты попробуй меня найти, когда отключены телефоны и нет меня в сети.
- _id: 6a62c85b7c64a644c48160a6
  category: jason_statham
  text: Сила не в бабках, ведь бабки уже старые.
- _id: 6a62c85b7c64a644c48160a7
  category: jason_statham
  text: Шкаф – не тумба. Тимон – не пумба.
- _id: 6a62c85b7c64a644c48160a8
  category: jason_statham
  text: Посрать без сигаретки, как чай без конфетки.
- _id: 6a62c85b7c64a644c48160a9
  category: jason_statham
  text: Скажи мне, кто твой друг, и оба идите нахер.
- _id: 6a62c85b7c64a644c48160aa
  category: jason_statham
  text: Лучше выпью стопку водки, чем снимусь в кино в колготках.
- _id: 6a62c85b7c64a644c48160ab
  category: jason_statham
  text: Ты живёшь как карта ляжет, я живу как мама скажет.
- _id: 6a62c85b7c64a644c48160ac
  category: jason_statham
  text: Тут – это вам не там.
- _id: 6a62c85b7c64a644c48160ad
  category: jason_statham
  text: Достал нож – режь. Взял дошик – ешь.
- _id: 6a62c85b7c64a644c48160ae
  category: jason_statham
  text: Хмели сумели, и ты сможешь!
- _id: 6a62c85b7c64a644c48160af
  category: jason_statham
  text: Шаг влево, шаг вправо – это два шага.
- _id: 6a62c85b7c64a644c48160b0
  category: jason_statham
  text: Завтра рано вставать, встану послезавтра.
- _id: 6a62c85b7c64a644c48160b1
  category: jason_statham
  text: Топленое молоко знаешь? Я утопил.
- _id: 6a62c85b7c64a644c48160b2
  category: jason_statham
  text: Когда ты почувствуешь себя лохом, то вспомни, что кто-то сейчас встречается
    с твоей бывшей.
- _id: 6a62c85b7c64a644c48160b3
  category: jason_statham
  text: Раньше я думал, что вечной любви не существует, пока не встретил пиво.
- _id: 6a62c85b7c64a644c48160b4
  category: jason_statham
  text: Говоришь на меня – переводишь на себя.
- _id: 6a62c85b7c64a644c48160b5
  category: jason_statham
  text: Перевод не получился, на тебя понос свалился.
- _id: 6a62c85b7c64a644c48160b6
  category: jason_statham
  text: Пресс для лохов – пивной живот для мужиков.
- _id: 6a62c85b7c64a644c48160b7
  category: jason_statham
  text: Никогда не откладывай на завтра то, на что можно забить сегодня.
- _id: 6a62c85b7c64a644c48160b8
  category: jason_statham
  text: Запомни, одна ошибка и ты ошибся.
- _id: 6a62c85b7c64a644c48160b9
  category: jason_statham
  text: Если заблудился в лесу, иди домой.
- _id: 6a62c85b7c64a644c48160ba
  category: jason_statham
  text: Слабый мужчина ищет оправдания, а настоящий мужик их заранее подготовил.
- _id: 6a62c85b7c64a644c48160bb
  category: jason_statham
  text: Я настоящий экстремал, я срал в гостях и не смывал.
- _id: 6a62c85b7c64a644c48160bc
  category: jason_statham
  text: Девушка вынашивает ребенка 9 месяцев. Я выношу его с одного удара.
- _id: 6a62c85b7c64a644c48160bd
  category: jason_statham
  text: Не бойся, когда ты один – бойся, когда ты два.
- _id: 6a62c85b7c64a644c48160be
  category: jason_statham
  text: Не важно, кто прав, важно, кто лев.
- _id: 6a62c85b7c64a644c48160bf
  category: jason_statham
  text: Собакам нельзя доверять, потому что они издают lie.
- _id: 6a62c85b7c64a644c48160c0
  category: jason_statham
  text: Помни, если тебя съели, у тебя есть два выхода.
- _id: 6a62c85b7c64a644c48160c1
  category: jason_statham
  text: Не яйца красят человека, а человек яйца.
- _id: 6a62c85b7c64a644c48160c2
  category: jason_statham
  text: Я такой человек, который терпит, терпит, а потом как терпит, терпит.
- _id: 6a62c85b7c64a644c48160c3
  category: jason_statham
  text: Надевайте шапки, братья, когда на улице мороз.
- _id: 6a62c85b7c64a644c48160c4
  category: jason_statham
  text: Пацаны не уступают бабкам место, ведь бабки в жизни – не главное.
- _id: 6a62c85b7c64a644c48160c5
  category: jason_statham
  text: Пары – не удары, можно и пропустить. Учеба – не усейн болт, не убежит.
- _id: 6a62c85b7c64a644c48160c6
  category: jason_statham
  text: Любишь яйца жухать, люби и пальцы нюхать.
- _id: 6a62c85b7c64a644c48160c7
  category: jason_statham
  text: Льва Толстого знаешь? Я покормил.
- _id: 6a62c85b7c64a644c48160c8
  category: jason_statham
  text: Базар, как вода. Чем больше фильтруешь, тем меньше проблем с почками.
- _id: 6a62c85b7c64a644c48160c9
  category: jason_statham
  text: Если паническая атака неизбежна, атакуй первым.
- _id: 6a62c85b7c64a644c48160ca
  category: jason_statham
  text: У всех лысых прически одинаковые.
- _id: 6a62c85b7c64a644c48160cb
  category: jason_statham
  text: Семь раз отпей – один отлей.
- _id: 6a62c85b7c64a644c48160cc
  category: jason_statham
  text: Называешь меня братом, а где ты был, когда я резал лук и плакал?
- _id: 6a62c85b7c64a644c48160cd
  category: jason_statham
  text: Ной не ныл, и ты не ной.
- _id: 6a62c85b7c64a644c48160ce
  category: jason_statham
  text: Когда я вижу имена парочек, вырезанные на деревьях, я не думаю, что это мило,
    я думаю, почему эти люди берут на свидание нож.
- _id: 6a62c85b7c64a644c48160cf
  category: jason_statham
  text: Горчицу знаешь? Я огорчил.
- _id: 6a62c85b7c64a644c48160d0
  category: jason_statham
  text: Лысина и челочка – даст любая телочка.
- _id: 6a62c85b7c64a644c48160d1
  category: jason_statham
  text: Раз в сутки, суп должен быть в желудке.
- _id: 6a62c85b7c64a644c48160d2
  category: jason_statham
  text: Алкоголизм – это страшно, но я не из трусливых.
- _id: 6a62c85b7c64a644c48160d3
  category: jason_statham
  text: Дают бери, не дают – отбери.
- _id: 6a62c85b7c64a644c48160d4
  category: jason_statham
  text: Позвоночник знаешь? Я позвонил.
- _id: 6a62c85b7c64a644c48160d5
  category: jason_statham
  text: Три слова – это два слова.
- _id: 6a62c85b7c64a644c48160d6
  category: jason_statham
  text: Не спеши, а то – успеешь.
- _id: 6a62c85b7c64a644c48160d7
  category: jason_statham
  text: Мама денежку дала, жизнь нормальная пошла.
- _id: 6a62c85b7c64a644c48160d8
  category: jason_statham
  text: Чем старше человек, тем больше ему лет.
- _id: 6a62c85b7c64a644c48160d9
  category: jason_statham
  text: Кто носит кофту адидас, тому любая баба даст.
- _id: 6a62c85b7c64a644c48160da
  category: jason_statham
  text: Только подкаблучник будет отпрашиваться у жены.
- _id: 6a62c85b7c64a644c48160db
  category: jason_statham
  text: Только подкаблучник спрашивает у жены, можно ли сходить выпить пиво с пацанами,
    настоящий мужик и так знает, что нельзя.
- _id: 6a62c85b7c64a644c48160dc
  category: jason_statham
  text: Не бойся ножа, бойся вилки – один удар четыре дырки.
- _id: 6a62c85b7c64a644c48160dd
  category: jason_statham
  text: Если б море было водкой, я бы стал подводной лодкой.
- _id: 6a62c85b7c64a644c48160de
  category: jason_statham
  text: Хороший человек плохой воздух в себе держать не будет.
- _id: 6a62c85b7c64a644c48160df
  category: jason_statham
  text: Мы в ответе за тех, кому наливаем.
- _id: 6a62c85b7c64a644c48160e0
  category: jason_statham
  text: Прошу прощения матерей, чьих возбудил я дочерей.
- _id: 6a62c85b7c64a644c48160e1
  category: jason_statham
  text: Кто обзывается, тот сам так называется.
- _id: 6a62c85b7c64a644c48160e2
  category: jason_statham
  text: Дело – бабу с возу.
- _id: 6a62c85b7c64a644c48160e3
  category: jason_statham
  text: На Пасху не забудьте навернуть кулича.
- _id: 6a62c85b7c64a644c48160e4
  category: jason_statham
  text: Слышал, что скупой платит дважды, теперь хочу работать у скупого.
- _id: 6a62c85b7c64a644c48160e5
  category: jason_statham
  text: Если долго смотреть на огонь, то тебя могут уволить из пожарников.
- _id: 6a62c85b7c64a644c48160e6
  category: jason_statham
  text: Нет лучше подарочка, чем жена татарочка.
- _id: 6a62c85b7c64a644c48160e7
  category: jason_statham
  text: Если мама медик, а папа мент, то ребенок медикамент.
- _id: 6a62c85b7c64a644c48160e8
  category: jason_statham
  text: Жена – это единственная вредная привычка, которая может бросить тебя сама.
- _id: 6a62c85b7c64a644c48160e9
  category: jason_statham
  text: На работе подарили полотенце с голой женщиной. Жене полотенце понравилось,
    но голую женщину, к сожалению, пришлось прогнать.
- _id: 6a62c85b7c64a644c48160ea
  category: jason_statham
  text: Кто не падал, тот не поднимался. Раз упал, то отжимайся.
- _id: 6a62c85b7c64a644c48160eb
  category: jason_statham
  text: Я встаю, чтобы разбудить будильник.
- _id: 6a62c85b7c64a644c48160ec
  category: jason_statham
  text: 'Алкоголь – враг человечества, но в библии сказано: «Возлюби врага своего».'
- _id: 6a62c85b7c64a644c48160ed
  category: jason_statham
  text: Неважно кто с кем спит, главное, чтобы все выспались.
- _id: 6a62c85b7c64a644c48160ee
  category: jason_statham
  text: Stone Island знаешь? Я заставил стонать.
- _id: 6a62c85b7c64a644c48160ef
  category: jason_statham
  text: Никогда не деритесь с беременными женщинами, потому что они всегда готовы
    к схваткам.
- _id: 6a62c85b7c64a644c48160f0
  category: jason_statham
  text: 'Пацаны запомните: после черной полосы всегда идет белая. Если тебя сегодня
    укусила злая собака, то завтра обязательно укусит добрая.'
- _id: 6a62c85b7c64a644c48160f1
  category: jason_statham
  text: Бабки не главное, главное – их пенсия.
- _id: 6a62c85b7c64a644c48160f2
  category: jason_statham
  text: Рабы системы пьют с друзьями по пятницам. Свободная личность не обращает внимания
    на такие мелочи, как дни недели.
- _id: 6a62c85b7c64a644c48160f3
  category: jason_statham
  text: Не так часто мужик преклоняет колено перед женщиной, как перед одноразовым
    мангалом.
- _id: 6a62c85b7c64a644c48160f4
  category: jason_statham
  text: Не молчите. Жизнь слишком коротка, чтобы молчать. Много тоже не высказывайте,
    а то станет еще короче.
- _id: 6a62c85b7c64a644c48160f5
  category: jason_statham
  text: Чтобы не пьянеть, надо не пить.
- _id: 6a62c85b7c64a644c48160f6
  category: jason_statham
  text: 'Пацаны запомните: вы можете делать все, что считаете нужным, но никогда не
    мойте яйца мятным шампунем.'
- _id: 6a62c85b7c64a644c48160f7
  category: jason_statham
  text: Лучше светлое пиво, чем темное будущее.
- _id: 6a62c85b7c64a644c48160f8
  category: jason_statham
  text: Посетил остров, где проживали тысячи девушек. Теперь это остров, где проживают
    тысяча женщин.
- _id: 6a62c85b7c64a644c48160f9
  category: jason_statham
  text: Однажды я выложил пост в соцсетях. И это стало началом моего обучения русскому
    языку.
- _id: 6a62c85b7c64a644c48160fa
  category: jason_statham
  text: Минус на минус дает плюс.
- _id: 6a62c85b7c64a644c48160fb
  category: jason_statham
  text: Мужчины не падают, они атакуют пол.
- _id: 6a62c85b7c64a644c48160fc
  category: jason_statham
  text: Если кубики – это пресс, то круглый живот – это депрессия.
- _id: 6a62c85b7c64a644c48160fd
  category: jason_statham
  text: Мужчины идут на подвиги ради дам. Ради не дам не идут.
- _id: 6a62c85b7c64a644c48160fe
  category: jason_statham
  text: Каждый уважающий себя мужчина должен 2 рубля в ларьке.
- _id: 6a62c85b7c64a644c48160ff
  category: jason_statham
  text: Кто не с нами, тот под нами.
- _id: 6a62c85b7c64a644c4816100
  category: jason_statham
  text: Настоящий мужчина, как ковер тети Зины. С каждым годом лысее.
- _id: 6a62c85b7c64a644c4816101
  category: jason_statham
  text: Don't worry, be happy. Pey wiski, love siski.
- _id: 6a62c85b7c64a644c4816102
  category: jason_statham
  text: Посрать без пука, как съесть шашлык без лука.
- _id: 6a62c85b7c64a644c4816103
  category: jason_statham
  text: Если хочешь идти – иди. Если хочешь забыть – забудь.
- _id: 6a62c85b7c64a644c4816104
  category: jason_statham
  text: Если сделать греческий салат 31 декабря, то завтра он станет древнегреческим.
- _id: 6a62c85b7c64a644c4816105
  category: jason_statham
  text: 'Пацаны запомните: огурцы съешь сам, кабачки раздай близким. А баклажаны оставь
    на рагу.'
- _id: 6a62c85b7c64a644c4816106
  category: jason_statham
  text: Не спешите вытаскивать людей из дерьма. Возможно это их естественная среда
    обитания.
- _id: 6a62c85b7c64a644c4816107
  category: jason_statham
  text: Сымитировать скриншот переписки, так же просто, как и оргазм.
- _id: 6a62c85b7c64a644c4816108
  category: jason_statham
  text: Какая разница, что говорят о тебе за спиной, если при встрече их язык находится
    в жопе.
- _id: 6a62c85b7c64a644c4816109
  category: jason_statham
  text: Ты так прекрасна и красива, когда взяла мне ящик пива.
- _id: 6a62c85b7c64a644c481610a
  category: jason_statham
  text: Мертвое море знаешь? Я убил.
- _id: 6a62c85b7c64a644c481610b
  category: jason_statham
  text: Ты не ты, когда за тобой бегут менты.
- _id: 6a62c85b7c64a644c481610c
  category: jason_statham
  text: Запомните твари… Запомнили? Теперь забудьте!
- _id: 6a62c85b7c64a644c481610d
  category: jason_statham
  text: 'В штанах две пушки: 1 огнестрел, другой для подружки.'
- _id: 6a62c85b7c64a644c481610e
  category: jason_statham
  text: На сердце боль, в душе тоска… Второго нет нигде носка.
- _id: 6a62c85b7c64a644c481610f
  category: jason_statham
  text: С одной стороны, в гости приходить без бутылки неприлично. С другой стороны,
    если у тебя есть бутылка, то зачем вообще идти в гости?
- _id: 6a62c85b7c64a644c4816110
  category: jason_statham
  text: В куличах – это верхушка.
- _id: 6a62c85b7c64a644c4816111
  category: jason_statham
  text: Я по 2 раза за бухлом не бегаю.
- _id: 6a62c85b7c64a644c4816112
  category: jason_statham
  text: Чтобы дойти до цели, нужно встать с постели.
- _id: 6a62c85b7c64a644c4816113
  category: jason_statham
  text: Соседка снизу может быть сверху.
- _id: 6a62c85b7c64a644c4816114
  category: jason_statham
  text: Хорошо смеется тот, кто сидит на последней парте.
- _id: 6a62c85b7c64a644c4816115
  category: jason_statham
  text: Лето без кваса, как шашлындос без пиваса.
- _id: 6a62c85b7c64a644c4816116
  category: jason_statham
  text: Если хотите поднять бабла, положите деньги на пол, а потом поднимите.
- _id: 6a62c85b7c64a644c4816117
  category: jason_statham
  text: Марианскую впадину знаешь? Я замариновал.
- _id: 6a62c85b7c64a644c4816118
  category: jason_statham
  text: Круто – это когда мама забыла про сдачу.
- _id: 6a62c85b7c64a644c4816119
  category: jason_statham
  text: Кто рано встает, тому весь день спать хочется.
- _id: 6a62c85b7c64a644c481611a
  category: jason_statham
  text: Жизнь – не сахар, в этом вся соль.
- _id: 6a62c85b7c64a644c481611b
  category: jason_statham
  text: Ключ разводной знаешь? Я разводил.
- _id: 6a62c85b7c64a644c481611c
  category: jason_statham
  text: Не судите девушек за килограммы, да не судимы будете за сантиметры.
- _id: 6a62c85b7c64a644c481611d
  category: jason_statham
  text: Фарта, удачи, воровского азарта, а также любви, и ложилась чтоб карта.
- _id: 6a62c85b7c64a644c481611e
  category: jason_statham
  text: Чем меньше знаешь, тем больше ты тупой.
- _id: 6a62c85b7c64a644c481611f
  category: jason_statham
  text: Не круто пить, не круто врать, а круто маме помогать.
- _id: 6a62c85b7c64a644c4816120
  category: jason_statham
  text: Пиво утром как зарядка, пьешь его и все в порядке.
- _id: 6a62c85b7c64a644c4816121
  category: jason_statham
  text: Жизнь нужно прожить так, чтобы тебе приписывали все цитаты.
- _id: 6a62c85b7c64a644c4816122
  category: jason_statham
  text: Жизнь грустная, зато зарплата смешная.
- _id: 6a62c85b7c64a644c4816123
  category: vahtang
  text: Картинок много - можно порнохаб открыть.
- _id: 6a62c85b7c64a644c4816124
  category: vahtang
  text: Хотят L3, ЗО, и чтоб девчонки танцевали канкан!
- _id: 6a62c85b7c64a644c4816125
  category: vahtang
  text: Жопа-писюн, господа и дамы!
- _id: 6a62c85b7c64a644c4816126
  category: vahtang
  text: Они хотят свинью за яйца дернуть - и чтобы она им арии итальянские пела...
- _id: 6a62c85b7c64a644c4816127
  category: vahtang
  text: Знаешь сколько они стоят? Пипец глазам!
- _id: 6a62c85b7c64a644c4816128
  category: vahtang
  text: Был мальчик - стал пропеллер!
- _id: 6a62c85b7c64a644c4816129
  category: vahtang
  text: Рожь не уродилась, пшеница вся побилась, десантник этот, надоел...
- _id: 6a62c85b7c64a644c481612a
  category: vahtang
  text: Обещал - не значит женился.
- _id: 6a62c85b7c64a644c481612b
  category: vahtang
  text: Нам не нужно 900 - два по 200, и 500.
- _id: 6a62c85b7c64a644c481612c
  category: vahtang
  text: А ты зачем мне шарфик распустил?
- _id: 6a62c85b7c64a644c481612d
  category: vahtang
  text: Откуда у бомжа печенье?
- _id: 6a62c85b7c64a644c481612e
  category: vahtang
  text: Легче верблюду пройти сквозь игольное ушко, чем богатому войти в царство небесное.
- _id: 6a62c85b7c64a644c481612f
  category: vahtang
  text: Обидели мышку - написяли в норку.
- _id: 6a62c85b7c64a644c4816130
  category: vahtang
  text: Делаем за деньги рыбу.
- _id: 6a62c85b7c64a644c4816131
  category: vahtang
  text: Будем вот такие щи строить и с трудом припоминать...
- _id: 6a62c85b7c64a644c4816132
  category: vahtang
  text: Работает или не работает, это как немножко беременна.
- _id: 6a62c85b7c64a644c4816133
  category: vahtang
  text: Украл x%й - спрятал в жопу.
- _id: 6a62c85b7c64a644c4816134
  category: vahtang
  text: Заказывал серебро - а пришло золото.
- _id: 6a62c85b7c64a644c4816135
  category: vahtang
  text: Давайте не будем тянуть кота за рога!
- _id: 6a62c85b7c64a644c4816136
  category: vahtang
  text: И на ёлку залезть и жопу не оцарапать.
- _id: 6a62c85b7c64a644c4816137
  category: vahtang
  text: Пукнул, икнул, сто грамм выпил - месяц прошел.
- _id: 6a62c85b7c64a644c4816138
  category: vahtang
  text: Из быка не сделать скаковую лошадь, даже если каждые пять минут прищемлять
    ему яйца.
- _id: 6a62c85b7c64a644c4816139
  category: vahtang
  text: Здесь - смотри,  здесь - не смотри, здесь - рыбу заворачивали.
- _id: 6a62c85b7c64a644c481613a
  category: vahtang
  text: Если одному солдату натирает сапог - всю партию возвращать никто не будет.
- _id: 6a62c85b7c64a644c481613b
  category: vahtang
  text: Мальчик жестами объяснил, что его зовут Хуан.
- _id: 6a62c85b7c64a644c481613c
  category: vahtang
  text: Зачем Володька сбрил усы?
- _id: 6a62c85b7c64a644c481613d
  category: vahtang
  text: Дым в трубу, пельмени разлепили.
- _id: 6a62c85b7c64a644c481613e
  category: vahtang
  text: А если кто-то будет жульничать - получит по наглой, рыжей морде.
- _id: 6a62c85b7c64a644c481613f
  category: vahtang
  text: Или шашечки - или едем.
- _id: 6a62c85b7c64a644c4816140
  category: vahtang
  text: Комиссия отца Денисия.
- _id: 6a62c85b7c64a644c4816141
  category: vahtang
  text: Скорость интернета - кот нагадил в руки.
- _id: 6a62c85b7c64a644c4816142
  category: vahtang
  text: Дождь пошел - дорога намокнет.
- _id: 6a62c85b7c64a644c4816143
  category: vahtang
  text: Дай дураку x%й стеклянный - он и x%й разобьет, и руки порежет.
- _id: 6a62c85b7c64a644c4816144
  category: vahtang
  text: У семи нянек - четырнадцать сисек.
- _id: 6a62c85b7c64a644c4816145
  category: vahtang
  text: Человек привыкает ко всему, даже к виселице. Две минуты подергался, и глядишь
    - привык.
- _id: 6a62c85b7c64a644c4816146
  category: vahtang
  text: В Ташкенте кушать нечего.
- _id: 6a62c85b7c64a644c4816147
  category: vahtang
  text: Бабушку только дорогу научили переходить, а вы хотите, чтобы она по диагонали
    бегала.
- _id: 6a62c85b7c64a644c4816148
  category: vahtang
  text: Если у нас колеса и две палки - то это не значит, что мы можем поехать на
    море.
- _id: 6a62c85b7c64a644c4816149
  category: vahtang
  text: Ну вы барин, задачи ставите...
- _id: 6a62c85b7c64a644c481614a
  category: vahtang
  text: А Вася не пойдет за маком?
- _id: 6a62c85b7c64a644c481614b
  category: vahtang
  text: А нас потом спрашивают - почему баня сгорела.
- _id: 6a62c85b7c64a644c481614c
  category: vahtang
  text: Если вас сожрали - у вас два выхода.
- _id: 6a62c85b7c64a644c481614d
  category: vahtang
  text: В умелых руках, и x%й - балалайка.
- _id: 6a62c85b7c64a644c481614e
  category: vahtang
  text: В огороде - бузина, а в Киеве - дядька.
- _id: 6a62c85b7c64a644c481614f
  category: vahtang
  text: Смена прошла - да и x%й с ней.
- _id: 6a62c85b7c64a644c4816150
  category: vahtang
  text: Миша, все x%йня - давай по-новой!
- _id: 6a62c85b7c64a644c4816151
  category: vahtang
  text: Жопа - вид спереди.
- _id: 6a62c85b7c64a644c4816152
  category: vahtang
  text: Старость наступает тогда, когда хотел проспать работу и не получилось.
- _id: 6a62c85b7c64a644c4816153
  category: vahtang
  text: Если и сейчас тараканы не уйдут - я x%й его знает...
- _id: 6a62c85b7c64a644c4816154
  category: vahtang
  text: Зачем такой тюнинг в Омском зоопарке?
- _id: 6a62c85b7c64a644c4816155
  category: vahtang
  text: Это было в розовых влажных мечтах...
- _id: 6a62c85b7c64a644c4816156
  category: vahtang
  text: Краткость - сестра таланта, когда она не одна в семье.
- _id: 6a62c85b7c64a644c4816157
  category: vahtang
  text: Вместе с ума не сходят - вместе гриппом болеют.
- _id: 6a62c85b7c64a644c4816158
  category: vahtang
  text: Одели костюм зайчика на собаку, и пустили в лес.
- _id: 6a62c85b7c64a644c4816159
  category: vahtang
  text: Продали рыбу за деньги.
- _id: 6a62c85b7c64a644c481615a
  category: vahtang
  text: Умер дед Максим - да и x%й с ним.
- _id: 6a62c85b7c64a644c481615b
  category: vahtang
  text: Ничто так не украсит новогодний стол, как петарда в оливье.
- _id: 6a62c85b7c64a644c481615c
  category: vahtang
  text: Каждый шаг за x%й тянуть надо...
- _id: 6a62c85b7c64a644c481615d
  category: vahtang
  text: Есть два способа управлять женщинами - но никто их не знает!
- _id: 6a62c85b7c64a644c481615e
  category: vahtang
  text: Бьют не по паспорту, бьют - по морде.
- _id: 6a62c85b7c64a644c481615f
  category: vahtang
  text: Да - да. Нет -нет. Хорошо - классно, положите на комод.
- _id: 6a62c85b7c64a644c4816160
  category: vahtang
  text: На РЖД легко ходить в отпуск. Начальник говорит - когда, жена говорит - куда.
- _id: 6a62c85b7c64a644c4816161
  category: vahtang
  text: Сели в лужу, и напердели!
- _id: 6a62c85b7c64a644c4816162
  category: vahtang
  text:
  - Не сделали? - Не сделали... - Но сделаете? - Но сделаем.
- _id: 6a62c85b7c64a644c4816163
  category: vahtang
  text: Вы хотели пати? Нате!
- _id: 6a62c85b7c64a644c4816164
  category: vahtang
  text: Зачем городить огород, если там завтра будет море?
- _id: 6a62c85b7c64a644c4816165
  category: vahtang
  text: Вход через задний проход.
- _id: 6a62c85b7c64a644c4816166
  category: vahtang
  text: Мы сейчас дохлую кобылу пытаемся поставить в поле, надеть плуг, и чтобы она
    нам поле пахала.
- _id: 6a62c85b7c64a644c4816167
  category: vahtang
  text: Все буквы угадали, а слово произнести не смогли.
- _id: 6a62c85b7c64a644c4816168
  category: vahtang
  text: Мы вам сделаем позолоченный коврик, но наступать вам на него не дадим.
- _id: 6a62c85b7c64a644c4816169
  category: vahtang
  text: Это как итальянский танк - не едет, не стреляет, но очень красивый!
- _id: 6a62c85b7c64a644c481616a
  category: vahtang
  text: Не нравится зять - живите с дочкой сами.
- _id: 6a62c85b7c64a644c481616b
  category: vahtang
  text: Проще дать, чем объяснить.
- _id: 6a62c85b7c64a644c481616c
  category: vahtang
  text: Ничто так не учит человека как пиздюлина.
- _id: 6a62c85b7c64a644c481616d
  category: vahtang
  text: Нам теперь надо это осторожненько донести и не расплескать.
- _id: 6a62c85b7c64a644c481616e
  category: vahtang
  text: П%здеть - не мешки ворочать!
- _id: 6a62c85b7c64a644c481616f
  category: vahtang
  text: Соломатин рвется к воротам!
- _id: 6a62c85b7c64a644c4816170
  category: vahtang
  text: А много ль корова даёт молока?
- _id: 6a62c85b7c64a644c4816171
  category: vahtang
  text: Обжегшись на молоке - начинаешь дуть на воду.
- _id: 6a62c85b7c64a644c4816172
  category: vahtang
  text: Давайте слона есть по частям
- _id: 6a62c85b7c64a644c4816173
  category: vahtang
  text: Не стоила овчинка выделки...
- _id: 6a62c85b7c64a644c4816174
  category: vahtang
  text: С драной овцы - хоть шерсти клок.
- _id: 6a62c85b7c64a644c4816175
  category: vahtang
  text: Если жена ночью храпит - это не повод менять жену.
- _id: 6a62c85b7c64a644c4816176
  category: latin
  text: Quod licet Jovi, non licet bovi. Что можно Иове, не можно корове.
- _id: 6a62c85b7c64a644c4816177
  category: chinese
  text: Пририсовать змее ноги. Переусердствовать, испортить дело лишним.
- _id: 6a62c85b7c64a644c4816178
  category: chinese
  text: Играть на лютне перед буйволом. Метать бисер перед свиньями; напрасно тратить
    слова.
- _id: 6a62c85b7c64a644c4816179
  category: chinese
  text: Нарисовать дракону зрачки. Добавить последний решающий штрих, который оживляет
    всё дело.
- _id: 6a62c85b7c64a644c481617a
  category: chinese
  text: Смотреть на небо со дна колодца. Иметь крайне ограниченный кругозор.
- _id: 6a62c85b7c64a644c481617b
  category: chinese
  text: Ждать зайца у дерева. Рассчитывать на случайную удачу, ничего не делая.
- _id: 6a62c85b7c64a644c481617c
  category: chinese
  text: Лягушка на дне колодца. О человеке с узким кругозором.
- _id: 6a62c85b7c64a644c481617d
  category: chinese
  text: Старик на границе потерял лошадь. Нет худа без добра; неудача может обернуться
    удачей.
- _id: 6a62c85b7c64a644c481617e
  category: chinese
  text: Затыкать уши при краже колокольчика. Самообман; прятать голову в песок.
- _id: 6a62c85b7c64a644c481617f
  category: chinese
  text: Разбить котлы и затопить лодки. Сжечь мосты; решиться на всё.
- _id: 6a62c85b7c64a644c4816180
  category: chinese
  text: Иметь в груди готовый бамбук. Иметь продуманный план действий.
- _id: 6a62c85b7c64a644c4816181
  category: chinese
  text: Чинить загон после пропажи овец. Лучше поздно, чем никогда.
- _id: 6a62c85b7c64a644c4816182
  category: chinese
  text: Одним действием достичь двух целей. Убить двух зайцев одним выстрелом.
- _id: 6a62c85b7c64a644c4816183
  category: chinese
  text: Въезжая в деревню, следуй её обычаям. С волками жить — по-волчьи выть.
- _id: 6a62c85b7c64a644c4816184
  category: chinese
  text: Лучше один раз увидеть, чем сто раз услышать.
- _id: 6a62c85b7c64a644c4816185
  category: chinese
  text: Называть оленя лошадью. Выдавать чёрное за белое; намеренно искажать истину.
- _id: 6a62c85b7c64a644c4816186
  category: chinese
  text: Любишь дом — люби и ворону на нём. Любишь человека — принимай и всё, что с
    ним связано.
- _id: 6a62c85b7c64a644c4816187
  category: chinese
  text: Пол-цзиня и восемь лянов. Одно и то же; два сапога пара.
- _id: 6a62c85b7c64a644c4816188
  category: chinese
  text: Единственный в своём роде; уникальный.
- _id: 6a62c85b7c64a644c4816189
  category: chinese
  text: Журавль среди кур. Белая ворона; человек, резко выделяющийся среди окружающих.
- _id: 6a62c85b7c64a644c481618a
  category: chinese
  text: Сильный пожирает слабого. Закон джунглей.
- _id: 6a62c85b7c64a644c481618b
  category: chinese
  text: Голова тигра, хвост змеи. Начать за здравие, а кончить за упокой.
- _id: 6a62c85b7c64a644c481618c
  category: chinese
  text: Капля воды камень точит. Терпение и труд всё перетрут.
- _id: 6a62c85b7c64a644c481618d
  category: chinese
  text: Тушить горящий воз хвороста чашкой воды. Капля в море; тщетная попытка.
- _id: 6a62c85b7c64a644c481618e
  category: chinese
  text: Не слышно ни ворон, ни воробьёв. Полная тишина; слышно, как муха пролетит.
- _id: 6a62c85b7c64a644c481618f
  category: chinese
  text: Как поступишь с другим, так и он с тобой. Как аукнется, так и откликнется.
- _id: 6a62c85b7c64a644c4816190
  category: chinese
  text: Начать дело голыми руками. Создать всё с нуля.
- _id: 6a62c85b7c64a644c4816191
  category: chinese
  text: Впустить волка в дом. Пригреть змею на груди.
- _id: 6a62c85b7c64a644c4816192
  category: chinese
  text: Коронный номер; то, в чём человек особенно силён (собаку съел).
- _id: 6a62c85b7c64a644c4816193
  category: chinese
  text: Вечны как небо и земля. На веки вечные.
- _id: 6a62c85b7c64a644c4816194
  category: chinese
  text: Ломать сухое и гнилое. Проще простого; плёвое дело.
- _id: 6a62c85b7c64a644c4816195
  category: chinese
  text: Слушать, но не слышать. Пропускать мимо ушей.
- _id: 6a62c85b7c64a644c4816196
  category: chinese
  text: Душа покинула тело. Быть в смятении; места себе не находить.
- _id: 6a62c85b7c64a644c4816197
  category: chinese
  text: Большая рыба и жирное мясо. Богатое угощение; обильная пища.
- _id: 6a62c85b7c64a644c4816198
  category: chinese
  text: Тянуть ростки, чтобы они быстрее выросли. Оказывать медвежью услугу.
- _id: 6a62c85b7c64a644c4816199
  category: chinese
  text: Лечить яд ядом. Клин клином вышибать.
- _id: 6a62c85b7c64a644c481619a
  category: chinese
  text: Масляные уста, скользкий язык. Болтать без умолку; язык без костей.
- _id: 6a62c85b7c64a644c481619b
  category: chinese
  text: Солнце садится, дорога кончается. Оказаться в безвыходном положении.
- _id: 6a62c85b7c64a644c481619c
  category: chinese
  text: Подобно бушующему огню. О чём-то мощном, стремительно развивающемся.
- _id: 6a62c85b7c64a644c481619d
  category: chinese
  text: Как рыба в воде. Чувствовать себя в своей стихии.
- _id: 6a62c85b7c64a644c481619e
  category: chinese
  text: Проникнуть в дерево на три фэня. О глубоком анализе или мощном воздействии.
- _id: 6a62c85b7c64a644c481619f
  category: chinese
  text: Трижды посетить соломенную хижину. Настойчиво приглашать талантливого человека.
- _id: 6a62c85b7c64a644c48161a0
  category: chinese
  text: Трое человек создают тигра. Ложь, повторённая многократно, начинает казаться
    правдой.
- _id: 6a62c85b7c64a644c48161a1
  category: chinese
  text: Зарезать петуха, чтобы напугать обезьян. Наказать одного в назидание другим.
- _id: 6a62c85b7c64a644c48161a2
  category: chinese
  text: Страшный шум и пыль столбом. О большой шумихе вокруг чего-либо.
- _id: 6a62c85b7c64a644c48161a3
  category: chinese
  text: Ситуация подобна раскалыванию бамбука. О стремительном, неудержимом продвижении.
- _id: 6a62c85b7c64a644c48161a4
  category: chinese
  text: Персиковый источник вне мира. Райский уголок; идиллическое место.
- _id: 6a62c85b7c64a644c48161a5
  category: chinese
  text: Не выпускать книгу из рук. Быть очень прилежным в учёбе.
- _id: 6a62c85b7c64a644c48161a6
  category: chinese
  text: Сычуаньская собака лает на солнце. Удивляться самым обычным вещам из-за своей
    невежественности.
- _id: 6a62c85b7c64a644c48161a7
  category: chinese
  text: Связать и положить на высокую полку. Положить под сукно; отложить в долгий
    ящик.
- _id: 6a62c85b7c64a644c48161a8
  category: chinese
  text: Вода спадёт — камни обнажатся. Тайное становится явным.
- _id: 6a62c85b7c64a644c48161a9
  category: chinese
  text: Со всех сторон слышны чуские песни. Оказаться в полной изоляции; быть окружённым
    врагами.
- _id: 6a62c85b7c64a644c48161aa
  category: chinese
  text: Меняться в лице при упоминании тигра. Дрожать от одного упоминания о чём-то
    страшном.
- _id: 6a62c85b7c64a644c48161ab
  category: chinese
  text: Цветок, распустившийся на миг. О чём-то быстротечном, эфемерном.
- _id: 6a62c85b7c64a644c48161ac
  category: chinese
  text: Богомол пытается задержать колесницу. Переоценивать свои силы; пытаться сделать
    невозможное.
- _id: 6a62c85b7c64a644c48161ad
  category: chinese
  text: Небесные цветы сыплются дождём. Говорить очень красноречиво, но часто пусто
    и бессодержательно.
- _id: 6a62c85b7c64a644c48161ae
  category: chinese
  text: Край неба и угол моря. На краю света; очень далёкое место.
- _id: 6a62c85b7c64a644c48161af
  category: chinese
  text: Божественные одежды не имеют швов. Безупречный, идеальный; без сучка и задоринки.
- _id: 6a62c85b7c64a644c48161b0
  category: chinese
  text: Переправляться через реку в одной лодке. Делить трудности и помогать друг
    другу.
- _id: 6a62c85b7c64a644c48161b1
  category: chinese
  text: Украсть небо и подменить солнце. Совершить грандиозный обман.
- _id: 6a62c85b7c64a644c48161b2
  category: chinese
  text: Когда карта развернулась, показался кинжал. Истинные намерения раскрываются
    в последний момент.
- _id: 6a62c85b7c64a644c48161b3
  category: chinese
  text: Вернуть нефритовый диск в целости в Чжао. Вернуть вещь владельцу в полной
    сохранности.
- _id: 6a62c85b7c64a644c48161b4
  category: chinese
  text: Утолять жажду, глядя на сливы. Утешать себя иллюзиями.
- _id: 6a62c85b7c64a644c48161b5
  category: chinese
  text: Глядя на море, вздыхать. Чувствовать своё бессилие перед чем-то грандиозным.
- _id: 6a62c85b7c64a644c48161b6
  category: chinese
  text: Помогать тигру нападать на жертву. Быть пособником в злых делах.
- _id: 6a62c85b7c64a644c48161b7
  category: chinese
  text: Спать на хворосте и лизать желчь. Терпеть лишения ради будущей победы или
    мести.
- _id: 6a62c85b7c64a644c48161b8
  category: chinese
  text: Прятать нож в улыбке. Быть лицемерным и коварным.
- _id: 6a62c85b7c64a644c48161b9
  category: chinese
  text: Обрезать ноги, чтобы подошли туфли. Подгонять реальность под жёсткие рамки;
    действовать    неразумно.
- _id: 6a62c85b7c64a644c48161ba
  category: chinese
  text: Опустить флаги и перестать бить в барабаны. Прекратить борьбу; свернуть деятельность.
- _id: 6a62c85b7c64a644c48161bb
  category: chinese
  text: Князь Е любил драконов. Любить что-то лишь на словах, а на деле бояться.
- _id: 6a62c85b7c64a644c48161bc
  category: chinese
  text: Зазнавшийся князь из Елана. Кичиться своим мнимым превосходством из-за невежества.
- _id: 6a62c85b7c64a644c48161bd
  category: chinese
  text: Поднять боевой дух первым ударом барабана. Сделать рывок на подъёме энтузиазма.
- _id: 6a62c85b7c64a644c48161be
  category: chinese
  text: Одной стрелой убить двух беркутов. Убить двух зайцев одним выстрелом.
- _id: 6a62c85b7c64a644c48161bf
  category: chinese
  text: Поразить всех одним криком. Внезапно прославиться; стать знаменитым после
    долгого молчания.
- _id: 6a62c85b7c64a644c48161c0
  category: chinese
  text: Енотовидные собаки с одного холма. Одного поля ягоды; два сапога пара (в негативном
    смысле).
- _id: 6a62c85b7c64a644c48161c1
  category: chinese
  text: Старик Юй Гун передвигает горы. Упорство и решимость способны преодолеть любые
    преграды.
- _id: 6a62c85b7c64a644c48161c2
  category: chinese
  text: Выдавать рыбий глаз за жемчужину. Выдавать подделку за настоящее.
- _id: 6a62c85b7c64a644c48161c3
  category: chinese
  text: Звуки мелодии ещё витают вокруг балок. О прекрасной, долго не забывающейся
    музыке или речи.
- _id: 6a62c85b7c64a644c48161c4
  category: chinese
  text: Просить у тигра его шкуру. Заниматься заведомо безнадёжным и опасным делом.
- _id: 6a62c85b7c64a644c48161c5
  category: chinese
  text: Кулик и беззубка сражаются. Борьба двух сторон, которой пользуется третья.
- _id: 6a62c85b7c64a644c48161c6
  category: chinese
  text: Утром три, вечером четыре. Семь пятниц на неделе; быть непостоянным.
- _id: 6a62c85b7c64a644c48161c7
  category: chinese
  text: Обсуждать стратегию на бумаге. Заниматься пустыми, оторванными от жизни рассуждениями.
- _id: 6a62c85b7c64a644c48161c8
  category: chinese
  text: Искать коня по рисунку. Действовать шаблонно, без учёта реальности.
- _id: 6a62c85b7c64a644c48161c9
  category: chinese
  text: Сто выстрелов — сто попаданий. Действовать наверняка; быть абсолютно точным.
- _id: 6a62c85b7c64a644c48161ca
  category: chinese
  text: Размахивать топором перед воротами Лу Баня. Хвастаться мастерством перед настоящим
    мастером.
- _id: 6a62c85b7c64a644c48161cb
  category: chinese
  text: Принимать отражение лука в чаше за змею. Страдать от пустых страхов и подозрений.
- _id: 6a62c85b7c64a644c48161cc
  category: chinese
  text: Строить карету за закрытыми воротами. Действовать в отрыве от реальности.
- _id: 6a62c85b7c64a644c48161cd
  category: chinese
  text: Болезнь проникла в жизненно важные органы. Быть смертельно больным; находиться
    в безнадёжном состоянии.
- _id: 6a62c85b7c64a644c48161ce
  category: chinese
  text: Каждый куст и дерево кажутся вражескими солдатами. Быть в панике; видеть угрозу
    во всём.
- _id: 6a62c85b7c64a644c48161cf
  category: chinese
  text: Раздувать мех в поисках изъяна. Придираться к мелочам.
- _id: 6a62c85b7c64a644c48161d0
  category: chinese
  text: Бить по траве, чтобы вспугнуть змею. Спровоцировать противника неосторожными
    действиями.
- _id: 6a62c85b7c64a644c48161d1
  category: chinese
  text: Выманить тигра с гор. Заставить противника покинуть выгодную позицию.
- _id: 6a62c85b7c64a644c48161d2
  category: chinese
  text: Дун Ши, подражая красавице, хмурит брови. Неумелое подражание, вызывающее
    лишь смех.
- _id: 6a62c85b7c64a644c48161d3
  category: chinese
  text: Принести хворост и просить о наказании. Искренне извиняться за свою вину.
- _id: 6a62c85b7c64a644c48161d4
  category: chinese
  text: Погубить успех дела из-за пустяка. Испортить всё в последний момент из-за
    мелочи.
- _id: 6a62c85b7c64a644c48161d5
  category: chinese
  text: Удовлетворяться стоянием на месте. Коснеть; отказываться от развития.
- _id: 6a62c85b7c64a644c48161d6
  category: chinese
  text: Выплёвывать песок, стреляя в тень. Тайно вредить; делать намёки, завуалированные
    выпады.
- _id: 6a7633e8862e2665dbe0bfc5
  category: krugly
  text: к чужому берегу лебеди да галки, к нашему - хуи да палки
- _id: 6a7633ed862e2665dbe0bfc6
  category: krugly
  text: по паспорту покойница, по пизде - разбойница
- _id: 6a7633ef862e2665dbe0bfc7
  category: krugly
  text: другие за пёзды построили избы, а я свою проносила - не выпила, ни закусила.
- _id: 6a7633f0862e2665dbe0bfc8
  category: krugly
  text: дурака учить что мёртвому хуй дрочить
- _id: 6a7633f0862e2665dbe0bfc9
  category: krugly
  text: и не такие метели в ебало летели
- _id: 6a7633f1862e2665dbe0bfca
  category: krugly
  text: жрал до пота, срал до слез, сел работать и замерз
- _id: 6a7633f1862e2665dbe0bfcb
  category: krugly
  text: совет как хуй, не просят - не суй
- _id: 6a7633f1862e2665dbe0bfcc
  category: krugly
  text: 'цыганское лото: выиграл шляпу проебал пальто'
- _id: 6a7633f1862e2665dbe0bfcd
  category: krugly
  text: то конь устал, то хуй не встал
- _id: 6a7633f1862e2665dbe0bfce
  category: krugly
  text: полетели из пизды тефтели
- _id: 6a7633f2862e2665dbe0bfcf
  category: krugly
  text: обидели. всех ебали - а его не видели
- _id: 6a7633f2862e2665dbe0bfd0
  category: krugly
  text: 'а этот всё выгадывает: то в жопу залезет, то из пизды выглядывает'
- _id: 6a7633f2862e2665dbe0bfd1
  category: krugly
  text: земную жизнь дойдя до половины, я насмотрелся всякой ебанины
- _id: 6a7633f3862e2665dbe0bfd2
  category: krugly
  text: по деревне шёл Иван, был мороз трескучий. у Ивана хуй стоял. так, на всякий
    случай
- _id: 6a7633f3862e2665dbe0bfd3
  category: krugly
  text: не попил ты молочка - хуй сломался у бычка
- _id: 6a7633f4862e2665dbe0bfd4
  category: krugly
  text: или трусы надень, или крестик сними
- _id: 6a7633f4862e2665dbe0bfd5
  category: krugly
  text: если всем давать – надо новую кровать
- _id: 6a76fae0e8e7820b0491be9d
  category: krugly
  text: если каждому давать - поломается кровать
- _id: 6a76faf9e8e7820b0491be9e
  category: krugly
  text: жил грешно и помер смешно
